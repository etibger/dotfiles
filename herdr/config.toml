# herdr configuration — mirrored from ~/.config/tmux/tmux.conf

onboarding = false

[theme]
name = "rose-pine"

[keys]
prefix = "ctrl+b"
new_tab = ""
toggle_sidebar = "prefix+p"
goto = ["prefix+g", "ctrl+o"]

# Reload config (tmux: prefix+r)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Vim-style pane navigation (tmux: prefix+h/j/k/l)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Toggle back to the previously focused pane
last_pane = "prefix+tab"

# Split panes with | and - (tmux: \ and -)
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# Copy mode (tmux: prefix+;)
copy_mode = "prefix+semicolon"

# close_tab moved off shift+x (used for kill-session, like tmux)
close_tab = "prefix+alt+x"
rename_tab = "prefix+,"

[ui]
# Mouse control (tmux: set -g mouse on)
mouse_capture = true

# Keep prefix+p as expanded/compact; prefix+shift+p toggles compact/hidden.
sidebar_collapsed_mode = "compact"

# Top-row system load, refreshed every two seconds
tab_bar_position = "top"
tab_bar_right = [
  { type = "command", command = "/bin/sh ~/.config/herdr/status-system-load.sh", interval_seconds = 2, timeout_seconds = 2 },
]

[advanced]
# tmux: set -g history-limit 90000
scrollback_limit_bytes = 10800000

# Create named tabs at home while pane splits continue following the active pane.
[[keys.command]]
key = "prefix+c"
type = "popup"
command = "/bin/bash ~/.config/herdr/new-tab-home.sh"
description = "create tab at home"
width = "50%"
height = "20%"

# Fuzzy-select a pane in the active tab
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/bin/bash ~/.config/herdr/pane-picker.sh"
description = "pick pane in current tab"
width = "75%"
height = "65%"

# Edit config in a popup (tmux: prefix+alt+m)
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "vim ~/.config/herdr/config.toml"
description = "edit herdr config"

# Hide/show the compact sidebar rail by changing its collapsed presentation.
[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "/bin/bash ~/.config/herdr/toggle-sidebar-visibility.sh"
description = "hide/show collapsed sidebar"

# Kill server (tmux: prefix+shift+x / kill-session)
[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "herdr server stop"
description = "kill herdr server"

# Vim-herdr-navigation: seamless ctrl+h/j/k/l across vim splits and herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"


[theme.custom]
panel_bg = "#282a36"
sidebar_bg = "#22232d"
active_row_bg = "#21222c"
selection_bg = "#44475a"
surface0 = "#21222c"
surface1 = "#6272a4"
surface_dim = "#242631"
overlay0 = "#6272a4"
overlay1 = "#f8f8f2"
text = "#f8f8f2"
subtext0 = "#f8f8f2"
accent = "#bd93f9"
mauve = "#ff79c6"
green = "#50fa7b"
yellow = "#f1fa8c"
red = "#ff5555"
blue = "#bd93f9"
teal = "#8be9fd"
peach = "#ff6e6e"
