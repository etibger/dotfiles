# herdr configuration — mirrored from ~/.config/tmux/tmux.conf

onboarding = false

[theme]
name = "rose-pine"

[keys]
prefix = "ctrl+b"
new_tab = ""
toggle_sidebar = "prefix+p"
goto = ["prefix+g", "ctrl+o"]

# Reload config (tmux: prefix+r)
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# Vim-style pane navigation (tmux: prefix+h/j/k/l)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Toggle back to the previously focused pane
last_pane = "prefix+tab"

# Split panes with | and - (tmux: \ and -)
split_vertical = "prefix+backslash"
split_horizontal = "prefix+minus"

# Copy mode (tmux: prefix+;)
copy_mode = "prefix+semicolon"

# close_tab moved off shift+x (used for kill-session, like tmux)
close_tab = "prefix+alt+x"
rename_tab = "prefix+,"

[ui]
# Mouse control (tmux: set -g mouse on)
mouse_capture = true

# Keep prefix+p as expanded/compact; prefix+shift+p toggles compact/hidden.
sidebar_collapsed_mode = "compact"

# Top-row system load, refreshed every two seconds
tab_bar_position = "top"
tab_bar_right = [
  { type = "command", command = "/bin/sh ~/.config/herdr/status-system-load.sh", interval_seconds = 2, timeout_seconds = 2 },
]

# Go to popup (Ctrl+O, or Ctrl+B then G).
# Detailed layouts are enabled below for all agents and workspaces.
# Keep alternative rows examples commented; edit the active rows blocks to taste.
# Edit with Ctrl+B then Alt+M. Close Go to, then Ctrl+B then R to reload.
# From another terminal: herdr config check; herdr server reload-config

[ui.goto]
# Options: true / false. Default true: show the selected destination's details
# (pane identity/context, or the workspace creation directory).
show_details = true
# Options: true / false. Default true: show the selected pane's CWD or
# workspace's branch. Each false setting gives entries one more line of space.
show_meta = true

[ui.goto.agents]
# Every built-in pane field, separated into readable lines. Optional custom
# metadata appears only when reported; there is no wildcard for arbitrary keys.
# Field colors: agent lavender, location gray/blue, title dimmed pink,
# model cyan, reasoning yellow, and optional summary green.
rows = [
  ["state_icon", "state_text", { token = "agent", fg = "#cba6f7", bold = true }],
  ["machine", { token = "workspace", fg = "#bac2de" }, { token = "tab", fg = "#89b4fa" }],
  [{ token = "pane", fg = "#cdd6f4", bold = true }],
  [{ token = "terminal_title_stripped", fg = "#f5c2e7", bold = false, dim = true }],
  [{ token = "$model", fg = "#89dceb", bold = true }, { token = "$reasoning", fg = "#f9e2af", bold = true }],
  [{ token = "$summary", fg = "#a6e3a1" }],
]
# rows default: UNSET. Remove/comment the active rows block to restore it.
# There is no TOML null/unset value; rows = [] is NOT the default: it shows IDs.
# Each outer array entry is a displayed line; inner entries are ordered tokens.
# Maximum: 16 lines, 16 tokens per line. Repeated tokens are allowed.
# All built-in pane tokens:
#   state_icon              current state indicator, following ui.status_indicators
#   state_text              reported state label, otherwise the default state text
#   machine                 endpoint name (omitted with only one endpoint)
#   workspace               full workspace label
#   tab                     tab label (multiple tabs or a custom tab name)
#   pane                    agent pane title, otherwise the manual pane label
#   agent                   display name/name/detected agent/title fallback
#   terminal_title          full reported terminal title, including status markers
#   terminal_title_stripped reported terminal title with status markers stripped
#   $name                   any reported custom metadata token (e.g. $model,
#                           $summary, $load); unreported/expired values disappear
# Ordinary shells only provide pane/workspace/tab/machine and unknown state text;
# agent names, reported titles and custom metadata require an Agent record.
# Missing/hidden/blank content disappears; if no content remains, show the pane ID.
# Example: compact one-line layout.
# rows = [["state_icon", "pane", "agent", "state_text"]]
# Example: multiline layout (uncomment all five lines of this example).
# rows = [
#   ["state_icon", "pane", "agent", "state_text"],
#   ["workspace", "tab", "$model"],
#   ["terminal_title_stripped", "$summary"],
# ]
# Example: deliberately show only the stable pane ID.
# rows = []
# Every token may be a plain string OR a styled inline table:
#   token = "..."           required; choose any token listed above
#   fg = "#RGB" / "#RRGGBB" default omitted: use normal theme/status coloring;
#                           named colors and rgb(...) are not accepted here
#   bold = true / false     default omitted: keep the normal inherited style
#   dim = true / false      default omitted: keep the normal inherited style
#   rules = []              default empty; at most 16 ordered rules per token
# Example: fixed styling.
# rows = [[{ token = "pane", fg = "#89b4fa", bold = true, dim = false }]]
# Each rule must contain EXACTLY ONE condition:
#   equals = "text"         exact full-value match
#   contains = "text"       substring match
#   starts_with = "text"    prefix match
#   gt = number             strictly greater than a finite number
#   lt = number             strictly less than a finite number
# Text conditions: ignore_case = true / false (default false; ASCII folding).
# Numeric conditions: no ignore_case; values must be full finite numbers,
# without surrounding whitespace or suffixes such as %. Comparisons are strict.
# Rule effects: fg/bold/dim as above (default omitted: inherit the token style),
# hide = true / false (default false: keep the token). The FIRST matching rule
# wins; unmatched rules keep the base token style. Match before truncating text.
# state_icon and git_status accept fixed styles, but NOT conditional rules.
# Regex, fuzzy matching, scripts, row_gap and separator settings are unsupported.
# Example: hide a summary equal to quiet (case-sensitive).
# rows = [[{ token = "$summary", rules = [{ equals = "quiet", hide = true }] }]]
# Example: choose colors from reported numeric metadata.
# rows = [[{ token = "$load", fg = "#aaa", rules = [{ gt = 80, fg = "#f00", bold = true }, { lt = 30, dim = true }] }]]

[ui.goto.agents.rows_by_agent]
# Default: {} (this empty table). Each key replaces the WHOLE pane layout for
# that canonical agent. Unmatched agents use agents.rows, or the original layout
# if agents.rows is unset. An empty override [] deliberately shows only pane IDs.
# All canonical agent keys (use these exact names):
# pi, claude, codex, gemini, cursor, devin, agy, cline, omp, mastracode, opencode,
# copilot, kimi, kiro, droid, amp, grok, hermes, kilo, qodercli, qwen, letta,
# maki, muse. Same tokens/styles/rules and limits as agents.rows.
# codex = [["state_icon", "pane", "state_text"], ["terminal_title_stripped", "$model"], ["$summary"]]
# claude = [["state_icon", "agent", "state_text"], ["terminal_title_stripped"]]
# pi = []

[ui.goto.spaces]
# Every built-in workspace field, plus common optional workspace metadata.
rows = [
  ["state_icon", "state_text", "workspace"],
  ["branch", "git_status"],
  ["$project", "$jj_status"],
]
# rows default: UNSET. Remove/comment the active rows block to restore it.
# Set an array of token rows to customize it; [] deliberately shows workspace IDs.
# All workspace tokens:
#   state_icon    current workspace state indicator
#   state_text    current workspace state text
#   workspace     full workspace label
#   branch        available branch name
#   git_status    available ahead/behind counters (omitted when both are zero)
#   $name         reported workspace metadata (e.g. $project or $jj_status)
# Same row/token/style/rule limits as pane rows; missing/hidden values disappear.
# Branch/Git values are not suppressed for child worktrees in this popup.
# rows = [["state_icon", "workspace"], ["branch", "git_status", "$project"]]
# rows = [["workspace", "branch"]]
# rows = []
# Each multiline entry remains ONE selection/click target. Search still uses its
# original semantic fields even when hidden; custom tokens do not extend search.
# Removing these settings restores the original layouts and true footer defaults.

[advanced]
# tmux: set -g history-limit 90000
scrollback_limit_bytes = 10800000

# Create named tabs at home while pane splits continue following the active pane.
[[keys.command]]
key = "prefix+c"
type = "popup"
command = "/bin/bash ~/.config/herdr/new-tab-home.sh"
description = "create tab at home"
width = "50%"
height = "20%"

# Fuzzy-select a pane in the active tab
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/bin/bash ~/.config/herdr/pane-picker.sh"
description = "pick pane in current tab"
width = "75%"
height = "65%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "/Users/tibger01/Projects/personal-tools/bin/repo-status --fzf-inner"
description = "browse repository status"
width = "85%"
height = "65%"

# Edit config in a popup (tmux: prefix+alt+m)
[[keys.command]]
key = "prefix+alt+m"
type = "popup"
command = "vim ~/.config/herdr/config.toml"
description = "edit herdr config"

# Hide/show the compact sidebar rail by changing its collapsed presentation.
[[keys.command]]
key = "prefix+shift+p"
type = "shell"
command = "/bin/bash ~/.config/herdr/toggle-sidebar-visibility.sh"
description = "hide/show collapsed sidebar"

# Kill server (tmux: prefix+shift+x / kill-session)
[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "herdr server stop"
description = "kill herdr server"

# Vim-herdr-navigation: seamless ctrl+h/j/k/l across vim splits and herdr panes
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-theme-picker.open"


[theme.custom]
panel_bg = "#282a36"
sidebar_bg = "#22232d"
active_row_bg = "#21222c"
selection_bg = "#44475a"
surface0 = "#21222c"
surface1 = "#6272a4"
surface_dim = "#242631"
overlay0 = "#6272a4"
overlay1 = "#f8f8f2"
text = "#f8f8f2"
subtext0 = "#f8f8f2"
accent = "#bd93f9"
mauve = "#ff79c6"
green = "#50fa7b"
yellow = "#f1fa8c"
red = "#ff5555"
blue = "#bd93f9"
teal = "#8be9fd"
peach = "#ff6e6e"
